name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch==2.15.0 && pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: scikit-learn baseline, 5-fold CV (no GPU needed)
        run: python -m callgrader.cv
